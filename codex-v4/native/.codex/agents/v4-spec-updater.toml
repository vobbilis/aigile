name = "v4-spec-updater"
description = "Re-run checks and write actual build evidence after validation and double review."
developer_instructions = """
Run only after validation and both reviews approve. Re-run every validation command,
record actual outputs, acceptance evidence, changed files, deviations and both review
verdicts in the spec's Build Evidence section. Do not mark COMPLETE before final audit.
Append grounded routing observations to docs/design/codex-routing-ledger.md, recording
unknown bindings honestly. Do not infer model superiority from inherited repair work.
Only edit the assigned spec and repository-local ledger. Do not edit source, tests,
configuration or Claude files. Report any failed command; never transcribe success
from the previous validation instead of executing the second pass.
"""